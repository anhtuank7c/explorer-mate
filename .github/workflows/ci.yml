name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.configuration }})
    # This image carries Visual Studio 18 (toolset v145), which the projects are pinned to.
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        shell: powershell
        run: .\scripts\build.ps1 -Configuration ${{ matrix.configuration }}

      - name: Layer check and tests
        shell: powershell
        run: .\scripts\test.ps1 -Configuration ${{ matrix.configuration }} -NoBuild

      - name: Check exploit mitigations (BinSkim)
        if: matrix.configuration == 'Release'
        shell: powershell
        run: .\scripts\check-binaries.ps1 -Configuration Release

      - name: Upload binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ExplorerMate-Release-x64-unsigned
          path: |
            build/x64/Release/ExplorerMate.exe
            build/x64/Release/ExplorerMate.Shell.dll
            build/x64/Release/ExplorerMate.pdb
            build/x64/Release/ExplorerMate.Shell.pdb
          if-no-files-found: error
          retention-days: 14

  static-analysis:
    name: MSVC code analysis
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Any finding fails the job.
      - name: Build with /analyze
        shell: powershell
        run: .\scripts\build.ps1 -Configuration Debug -Analyze
