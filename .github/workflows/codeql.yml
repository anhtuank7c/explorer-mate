name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries are applied even when the code does not change.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build
        shell: powershell
        run: .\scripts\build.ps1 -Configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:c-cpp
